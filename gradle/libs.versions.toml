[versions]
# The shared build conventions. The compiler, AGP and Compose Multiplatform are NOT here: they come
# from `wip`, the catalog a sborka release publishes. The same build toon-ui runs on.
sborka = "0.5.0.135"
# Screenshots and design parity (B-05), the release on Maven Central; toon-ui's version.
viddik = "0.7.0"
# The system back gesture for an open dialog (B-36); Compose 1.12's own `BackHandler` is deprecated for it, and this
# is the version Compose 1.12.1 itself resolves.
navigationevent = "1.1.0"
# The frame benchmark's host on a phone (B-06), never a dependency of the library.
activity-compose = "1.13.0"
# 37 is forced by the AndroidX Compose 1.12 AAR metadata (kvadrant-ui measured 36 failing).
android-compileSdk = "37"
android-minSdk = "24"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }

[plugins]
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
